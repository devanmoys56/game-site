<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        
        .container {
            text-align: center;
        }
        
        h1 {
            color: white;
            margin-bottom: 20px;
        }
        
        canvas {
            border: 2px solid white;
            background: #000;
            display: block;
            margin: 0 auto 20px;
        }
        
        .info {
            color: white;
            font-size: 1.2em;
            margin-bottom: 15px;
        }
        
        button {
            background: #667eea;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← Back</a>
    <div class="container">
        <h1>🎾 Pong Game</h1>
        <div class="info">Player: <span id="p1Score">0</span> - Computer: <span id="p2Score">0</span></div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div>
            <button onclick="startGame()">Start Game</button>
            <button onclick="resetGame()">Reset</button>
        </div>
        <p style="color: white; margin-top: 20px;">Use W and S keys to move your paddle</p>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const paddleHeight = 100;
        const paddleWidth = 10;
        const ballSize = 8;
        
        const player1 = {
            x: 0,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            speed: 6,
            score: 0
        };
        
        const player2 = {
            x: canvas.width - paddleWidth,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            speed: 4,
            score: 0
        };
        
        let ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            dx: 5,
            dy: 5,
            size: ballSize,
            speed: 5
        };
        
        let gameRunning = false;
        let gameLoop;
        const keys = {};
        
        function drawPaddle(paddle) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
        }
        
        function drawBall() {
            ctx.fillStyle = '#fff';
            ctx.fillRect(ball.x - ball.size / 2, ball.y - ball.size / 2, ball.size, ball.size);
        }
        
        function drawGame() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Center line
            ctx.strokeStyle = '#fff';
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
            
            drawPaddle(player1);
            drawPaddle(player2);
            drawBall();
        }
        
        function updateGame() {
            if (!gameRunning) return;
            
            // Player 1 movement
            if (keys['w'] && player1.y > 0) player1.y -= player1.speed;
            if (keys['s'] && player1.y < canvas.height - player1.height) player1.y += player1.speed;
            
            // AI Player 2 movement
            const p2Center = player2.y + player2.height / 2;
            if (p2Center < ball.y - 35) player2.y += player2.speed;
            else if (p2Center > ball.y + 35) player2.y -= player2.speed;
            
            // Ball movement
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // Ball collision with top and bottom
            if (ball.y - ball.size / 2 <= 0 || ball.y + ball.size / 2 >= canvas.height) {
                ball.dy = -ball.dy;
            }
            
            // Ball collision with paddles
            if (ball.x - ball.size / 2 <= player1.x + player1.width &&
                ball.y >= player1.y && ball.y <= player1.y + player1.height) {
                ball.dx = -ball.dx;
            }
            
            if (ball.x + ball.size / 2 >= player2.x &&
                ball.y >= player2.y && ball.y <= player2.y + player2.height) {
                ball.dx = -ball.dx;
            }
            
            // Scoring
            if (ball.x < 0) {
                player2.score++;
                document.getElementById('p2Score').textContent = player2.score;
                resetBall();
            }
            
            if (ball.x > canvas.width) {
                player1.score++;
                document.getElementById('p1Score').textContent = player1.score;
                resetBall();
            }
            
            // Check win condition
            if (player1.score >= 5 || player2.score >= 5) {
                endGame();
                return;
            }
            
            drawGame();
        }
        
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * 5;
            ball.dy = (Math.random() - 0.5) * 5;
        }
        
        function startGame() {
            gameRunning = true;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, 30);
        }
        
        function resetGame() {
            gameRunning = false;
            if (gameLoop) clearInterval(gameLoop);
            player1.score = 0;
            player2.score = 0;
            document.getElementById('p1Score').textContent = 0;
            document.getElementById('p2Score').textContent = 0;
            resetBall();
            drawGame();
        }
        
        function endGame() {
            gameRunning = false;
            const winner = player1.score > player2.score ? 'You' : 'Computer';
            alert(`${winner} wins! Final Score: ${player1.score} - ${player2.score}`);
        }
        
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });
        
        drawGame();
    </script>
</body>
</html>
