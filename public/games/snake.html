<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        
        .container {
            text-align: center;
        }
        
        h1 {
            color: white;
            margin-bottom: 20px;
        }
        
        canvas {
            border: 2px solid white;
            background: #000;
            display: block;
            margin: 0 auto 20px;
        }
        
        .info {
            color: white;
            font-size: 1.2em;
            margin-bottom: 15px;
        }
        
        button {
            background: #667eea;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← Back</a>
    <div class="container">
        <h1>🐍 Snake Game</h1>
        <div class="info">Score: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div>
            <button onclick="startGame()">Start Game</button>
            <button onclick="pauseGame()">Pause</button>
            <button onclick="resetGame()">Reset</button>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let snake = [{x: 10, y: 10}];
        let food = {x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount)};
        let direction = {x: 1, y: 0};
        let nextDirection = {x: 1, y: 0};
        let score = 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameLoop;
        
        function drawGame() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw snake
            ctx.fillStyle = '#0f0';
            snake.forEach(segment => {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
            });
            
            // Draw food
            ctx.fillStyle = '#f00';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 1, gridSize - 1);
        }
        
        function update() {
            if (!gameRunning || gamePaused) return;
            
            direction = nextDirection;
            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
            
            // Check collision with walls
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }
            
            // Check collision with self
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }
            
            snake.unshift(head);
            
            // Check if food eaten
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                food = {x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount)};
            } else {
                snake.pop();
            }
            
            drawGame();
        }
        
        function startGame() {
            gameRunning = true;
            gamePaused = false;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 100);
        }
        
        function pauseGame() {
            gamePaused = !gamePaused;
        }
        
        function resetGame() {
            gameRunning = false;
            gamePaused = false;
            if (gameLoop) clearInterval(gameLoop);
            snake = [{x: 10, y: 10}];
            direction = {x: 1, y: 0};
            nextDirection = {x: 1, y: 0};
            score = 0;
            food = {x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount)};
            document.getElementById('score').textContent = score;
            drawGame();
        }
        
        function endGame() {
            gameRunning = false;
            if (gameLoop) clearInterval(gameLoop);
            alert(`Game Over! Final Score: ${score}`);
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' && direction.y === 0) nextDirection = {x: 0, y: -1};
            if (e.key === 'ArrowDown' && direction.y === 0) nextDirection = {x: 0, y: 1};
            if (e.key === 'ArrowLeft' && direction.x === 0) nextDirection = {x: -1, y: 0};
            if (e.key === 'ArrowRight' && direction.x === 0) nextDirection = {x: 1, y: 0};
        });
        
        drawGame();
    </script>
</body>
</html>
