<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Quest 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .game-area {
            width: 400px;
            height: 400px;
            background: #1a1a1a;
            margin: 20px auto;
            border-radius: 10px;
            border: 3px solid #667eea;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            padding: 10px;
        }
        
        .puzzle-piece {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            transition: all 0.3s;
            user-select: none;
        }
        
        .puzzle-piece:hover {
            transform: scale(1.05);
        }
        
        .puzzle-piece.matched {
            background: #00ff00;
            opacity: 0.5;
            cursor: default;
        }
        
        .stats {
            color: white;
            font-size: 1.2em;
            margin: 20px 0;
        }
        
        .controls {
            margin: 20px 0;
        }
        
        button {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← Back</a>
    <div class="container">
        <h1>Puzzle Quest 1 🧩</h1>
        <div class="stats">
            Matches: <span id="matches">0</span>/8 | Time: <span id="time">0</span>s
        </div>
        <div class="game-area" id="gameArea"></div>
        <div class="controls">
            <button onclick="startGame()">Start</button>
            <button onclick="resetGame()">Reset</button>
        </div>
    </div>
    
    <script>
        const emojis = ['🌟', '🎨', '🎭', '🎪', '🎯', '🎲', '🎸', '🎬'];
        let cards = [];
        let matched = 0;
        let startTime = 0;
        let gameRunning = false;
        let timeInterval = null;
        
        function initGame() {
            cards = [...emojis, ...emojis];
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            renderGame();
        }
        
        function renderGame() {
            const gameArea = document.getElementById('gameArea');
            gameArea.innerHTML = '';
            cards.forEach((emoji, idx) => {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                piece.textContent = emoji;
                piece.dataset.index = idx;
                piece.addEventListener('click', () => handleClick(idx));
                gameArea.appendChild(piece);
            });
        }
        
        function handleClick(idx) {
            if (!gameRunning) return;
            document.querySelector(`[data-index="${idx}"]`).classList.add('matched');
            matched++;
            document.getElementById('matches').textContent = matched;
            
            if (matched === 8) {
                endGame();
            }
        }
        
        function startGame() {
            gameRunning = true;
            matched = 0;
            startTime = Date.now();
            document.getElementById('matches').textContent = 0;
            
            if (timeInterval) clearInterval(timeInterval);
            timeInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('time').textContent = elapsed;
            }, 1000);
        }
        
        function resetGame() {
            gameRunning = false;
            matched = 0;
            if (timeInterval) clearInterval(timeInterval);
            document.getElementById('matches').textContent = 0;
            document.getElementById('time').textContent = 0;
            initGame();
        }
        
        function endGame() {
            gameRunning = false;
            if (timeInterval) clearInterval(timeInterval);
            alert('🎉 Puzzle Complete!');
        }
        
        initGame();
    </script>
</body>
</html>
