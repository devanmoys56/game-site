<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        
        .container {
            text-align: center;
        }
        
        h1 {
            color: white;
            margin-bottom: 20px;
        }
        
        .info {
            color: white;
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            gap: 10px;
            margin-bottom: 30px;
            background: #bbada0;
            padding: 10px;
            border-radius: 10px;
        }
        
        .tile {
            width: 80px;
            height: 80px;
            background: #cdc1b4;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            color: #776e65;
        }
        
        .tile.tile-2 { background: #eee4da; }
        .tile.tile-4 { background: #ede0c8; }
        .tile.tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile.tile-16 { background: #f59563; color: #f9f6f2; }
        .tile.tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile.tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile.tile-128 { background: #edcf72; color: #095f6b; font-size: 1.5em; }
        .tile.tile-256 { background: #edcc61; color: #095f6b; font-size: 1.5em; }
        .tile.tile-512 { background: #edc850; color: #095f6b; font-size: 1.5em; }
        .tile.tile-1024 { background: #edc53f; color: #095f6b; font-size: 1.2em; }
        .tile.tile-2048 { background: #edc22e; color: #095f6b; font-size: 1.2em; }
        
        button {
            background: #667eea;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← Back</a>
    <div class="container">
        <h1>🎯 2048</h1>
        <div class="info">Score: <span id="score">0</span></div>
        <div class="game-board" id="gameBoard"></div>
        <div>
            <button onclick="resetGame()">New Game</button>
        </div>
        <p style="color: white; margin-top: 20px;">Use arrow keys to move tiles</p>
    </div>
    
    <script>
        const gameBoard = document.getElementById('gameBoard');
        let grid = [];
        let score = 0;
        
        function initGame() {
            grid = Array(4).fill(null).map(() => Array(4).fill(0));
            score = 0;
            document.getElementById('score').textContent = score;
            addNewTile();
            addNewTile();
            render();
        }
        
        function addNewTile() {
            const empty = [];
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] === 0) empty.push({i, j});
                }
            }
            if (empty.length > 0) {
                const {i, j} = empty[Math.floor(Math.random() * empty.length)];
                grid[i][j] = Math.random() < 0.9 ? 2 : 4;
            }
        }
        
        function move(direction) {
            let moved = false;
            
            if (direction === 'left' || direction === 'right') {
                for (let i = 0; i < 4; i++) {
                    let row = grid[i];
                    if (direction === 'right') row = row.reverse();
                    
                    row = slide(row);
                    if (direction === 'right') row = row.reverse();
                    
                    if (grid[i].join() !== row.join()) moved = true;
                    grid[i] = row;
                }
            } else {
                const newGrid = Array(4).fill(null).map(() => Array(4).fill(0));
                for (let j = 0; j < 4; j++) {
                    let col = [grid[0][j], grid[1][j], grid[2][j], grid[3][j]];
                    if (direction === 'down') col = col.reverse();
                    
                    col = slide(col);
                    if (direction === 'down') col = col.reverse();
                    
                    for (let i = 0; i < 4; i++) {
                        if (newGrid[i][j] !== col[i]) moved = true;
                        newGrid[i][j] = col[i];
                    }
                }
                grid = newGrid;
            }
            
            if (moved) {
                addNewTile();
                render();
            }
        }
        
        function slide(arr) {
            arr = arr.filter(val => val !== 0);
            
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                }
            }
            
            while (arr.length < 4) arr.push(0);
            document.getElementById('score').textContent = score;
            return arr;
        }
        
        function render() {
            gameBoard.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    const tile = document.createElement('div');
                    const value = grid[i][j];
                    tile.className = `tile${value > 0 ? ` tile-${value}` : ''}`;
                    tile.textContent = value > 0 ? value : '';
                    gameBoard.appendChild(tile);
                }
            }
        }
        
        function resetGame() {
            initGame();
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') move('left');
            if (e.key === 'ArrowRight') move('right');
            if (e.key === 'ArrowUp') move('up');
            if (e.key === 'ArrowDown') move('down');
        });
        
        initGame();
    </script>
</body>
</html>
